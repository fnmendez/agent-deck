name: conductor-overlay

# The conductor overlay (conductor/overlay/) adds the local Telegram commands
# /agents, /peek and /send plus the idempotent reapply.sh. Its unit suite needs
# no third-party packages, so it gates every change to the overlay cheaply.

on:
  pull_request:
    paths:
      - 'conductor/overlay/**'
      # reapply.sh patches the canonical bridge at an exact anchor, so a stock
      # bridge change has to re-run the contract test that pins that coupling.
      - 'internal/session/conductor_bridge.py'
      - '.github/workflows/conductor-overlay.yml'
  push:
    branches: [main]
    paths:
      - 'conductor/overlay/**'
      - 'internal/session/conductor_bridge.py'
      - '.github/workflows/conductor-overlay.yml'

permissions:
  contents: read

jobs:
  overlay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor the stock bridge promises; the overlay imports
        # into that same interpreter, so it must hold the same floor.
        python-version: ['3.8', '3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check
        timeout-minutes: 3
        run: |
          python -m py_compile conductor/overlay/bridge_local.py \
                               conductor/overlay/delivery.py \
                               conductor/overlay/media.py \
                               conductor/overlay/transcribe.py
      - name: Shell syntax check
        timeout-minutes: 2
        run: bash -n conductor/overlay/reapply.sh
      - name: Overlay unit suite
        timeout-minutes: 5
        working-directory: conductor/overlay
        run: python -m unittest tests.test_bridge_local tests.test_media_and_peek -v
      # The transcribe.py adapter: CLI resolution order, fail-closed refusals,
      # and the exit-code mapping. The engine's own isolation guarantees are
      # pinned by the fnmendez/transcribe suite, not here.
      - name: Transcription adapter suite
        timeout-minutes: 8
        working-directory: conductor/overlay
        run: python -m unittest tests.test_transcribe_adapter -v
      # The voice channel is a command path, not an attachment path: these cover
      # authentication, exactly-once execution, the fail-closed branches, and the
      # round trip that returns the conductor's answer to Telegram.
      - name: Voice channel suite
        timeout-minutes: 5
        working-directory: conductor/overlay
        run: python -m unittest tests.test_voice_prompt tests.test_voice_channel -v
      - name: Reapply contract against the canonical bridge
        timeout-minutes: 3
        working-directory: conductor/overlay
        run: python -m unittest tests.test_reapply_contract -v
